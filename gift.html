<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift section - preview</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Preview only: no entrance, so show the section straight away. */
  body { background: var(--cream); }
  #gifts { padding-top: 60px; }
</style>
</head>
<body>

<div id="preview"></div>

<script>
// Pull the live #gifts section out of index.html so this page never drifts from it.
fetch('index.html')
  .then(r => r.text())
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.getElementById('preview').replaceChildren(doc.getElementById('gifts'));
    document.body.append(Object.assign(document.createElement('script'), { src: 'app.js' }));
  });
</script>

</body>
</html>
